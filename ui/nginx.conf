server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Static assets ─────────────────────────────────────────────────────
    # Serve files directly; fall back to index.html so the SPA handles
    # client-side routing for any unknown path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API proxy ─────────────────────────────────────────────────────────
    # All /api/ requests are forwarded to the api container.  The browser
    # only ever talks to one origin, so no CORS configuration is needed.
    #
    # The search endpoint streams NDJSON for the entire duration of a run
    # (potentially many minutes), so:
    #   - proxy_buffering off   — do not accumulate the response body before
    #                             forwarding; events reach the browser as they
    #                             arrive.
    #   - proxy_read_timeout    — webscout has no internal time limit; allow
    #                             20 minutes before nginx gives up.
    #   - HTTP/1.1 + Connection "" — required for chunked transfer encoding
    #                             (HTTP/1.0 does not support it).
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Disable response buffering so NDJSON events are streamed immediately.
        proxy_buffering    off;

        # Allow long-running research queries (webscout has no built-in timeout).
        proxy_read_timeout 1200s;
    }

    # ── MCP endpoint ──────────────────────────────────────────────────────
    # AI clients (Claude Code, opencode, pi, …) connect to http://<host>:3000/mcp.
    # The api checks the bearer token; nginx only forwards the Authorization
    # header untouched. Searches run as background jobs, so no single request
    # lasts longer than get_search_result's 55 s wait — 120 s leaves headroom.
    location = /mcp {
        proxy_pass         http://api:8080/mcp;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 120s;
    }
}
